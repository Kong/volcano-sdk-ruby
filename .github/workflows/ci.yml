name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.2", "3.4"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: bash .github/scripts/release-tests.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: npm ci
      - run: bin/check-openapi
      - run: bundle exec rubocop --parallel
      - run: bundle exec rspec
      - name: Validate Cucumber phrases
        env:
          CUCUMBER_PUBLISH_QUIET: "true"
          VOLCANO_SDK_CONTRACT_FIXTURE: ${{ github.workspace }}/tests/fixtures/sdk-contract-dry-run.json
        run: |
          chmod 600 "$VOLCANO_SDK_CONTRACT_FIXTURE"
          bundle exec cucumber features/contract --dry-run --strict --format progress
      - run: gem build volcano-sdk.gemspec
