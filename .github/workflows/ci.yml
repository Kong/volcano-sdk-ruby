name: CI

on:
  workflow_call:
  pull_request:
  merge_group:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.series }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - series: "3.3"
            ruby-version: "3.3.12"
          - series: "3.4"
            ruby-version: "3.4.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.25.14"
          cache: false
      - run: bash .github/scripts/actionlint.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.12+101.0.LTS"
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: npm ci
      - name: Run SDK quality checks
        run: bundle exec rake quality
      - name: Preserve required coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ruby-${{ matrix.ruby-version }}
          path: reports/coverage/
          if-no-files-found: error
      - name: Preserve failing quality reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-failures-ruby-${{ matrix.ruby-version }}
          path: |
            reports/property-failures/*.json
            reports/defects/
          if-no-files-found: ignore

  quality:
    name: Quality Gate
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'length == 1 and all(. == "success")' <<< "$RESULTS"
