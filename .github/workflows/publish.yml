name: Release package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run-id:
        description: Successful release-package workflow run ID
        required: true
        type: string
      sha256:
        description: Reviewed gem SHA-256 (required when publishing)
        type: string
      publish:
        description: Publish the reviewed gem to RubyGems.org
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false
  # Retain pending runs for versions that already have a GitHub release.
  queue: max

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: >-
      github.event_name == 'release' && github.event.release.prerelease == false &&
      github.event.release.draft == false && github.event.release.author.login == 'kong-volcano-app[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$RELEASE_TAG" = "v$(jq -er '.["."]' .release-please-manifest.json)"

  check:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: [validate, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: gem build volcano-sdk.gemspec
      - run: bash scripts/build-acceptance.sh volcano-sdk-*.gem acceptance-output
      - name: Smoke test the gem
        run: bash .github/scripts/smoke-gem.sh volcano-sdk-*.gem
      - name: Verify and record the release package
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(ruby -Ilib -rvolcano/version -e 'puts Volcano::VERSION')"
          test "v$version" = "$RELEASE_TAG"
          ruby -rrubygems/package -e '
            path = "volcano-sdk-#{ARGV.fetch(0)}.gem"
            abort "Expected one release gem" unless Dir["*.gem"] == [path]
            package = Gem::Package.new(path)
            package.verify
            abort "Unexpected gem identity" unless package.spec.name == "volcano-sdk" && package.spec.version.to_s == ARGV.fetch(0)
            puts package.spec.files.sort
          ' "$version" > package-files.txt
          sha256sum "volcano-sdk-$version.gem" > SHA256SUMS
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "Package: volcano-sdk $version"
            echo "Source: $RELEASE_TAG ($GITHUB_SHA)"
            echo '```text'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: |
            volcano-sdk-*.gem
            SHA256SUMS
            package-files.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-tests
          path: acceptance-output/sdk-acceptance.tar.gz
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acceptance-tests
          path: release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*
      - name: Publish acceptance bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/sdk-acceptance.tar.gz

  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    env:
      RELEASE_RUN_ID: ${{ inputs.run-id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the source release build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > release-run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repository.full_name == $repo and .event == "release" and
            .path == ".github/workflows/publish.yml" and
            .status == "completed" and .conclusion == "success"
          ' release-run.json
          tag="$(jq -er '.head_branch' release-run.json)"
          commit="$(jq -er '.head_sha' release-run.json)"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" |
            jq -e --arg tag "$tag" '.tag_name == $tag and .draft == false and .prerelease == false'
          test "$commit" = "$(git rev-parse "refs/tags/$tag^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main
          test "$tag" = "v$(git show "$commit:.release-please-manifest.json" | jq -er '.["."]')"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts" --paginate --slurp |
            jq -er '[.[].artifacts[] | select(.name == "release-package" and .expired == false)] |
              if length == 1 then .[0].id else error("Expected one unexpired release-package artifact") end')"
          {
            echo "artifact-id=$artifact_id"
            echo "tag=$tag"
            echo "commit=$commit"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"
          echo "Source: $tag ($commit), release build $RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.release.outputs.artifact-id }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: package
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: acceptance-tests
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: acceptance-output
      - name: Verify original release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          for artifact in package/*.gem acceptance-output/sdk-acceptance.tar.gz; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$SOURCE_COMMIT" --deny-self-hosted-runners
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-tests
          path: acceptance-output/sdk-acceptance.tar.gz
          if-no-files-found: error
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: false
      - name: Verify and record the package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          ruby -rrubygems/package -e '
            path = "package/volcano-sdk-#{ENV.fetch("RELEASE_VERSION")}.gem"
            abort "Expected one release gem" unless Dir["package/*.gem"] == [path]
            package = Gem::Package.new(path)
            package.verify
            abort "Unexpected gem identity" unless package.spec.name == "volcano-sdk" && package.spec.version.to_s == ENV.fetch("RELEASE_VERSION")
            puts package.spec.files.sort
          ' > package/package-files.txt
          cd package
          sha256sum "volcano-sdk-$RELEASE_VERSION.gem" > SHA256SUMS
          if [[ "$PUBLISH_REQUESTED" == "true" ]]; then
            [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
            test "$(cut -d ' ' -f 1 SHA256SUMS)" = "$EXPECTED_SHA256"
          fi
          {
            echo "Package: volcano-sdk $RELEASE_VERSION"
            echo '```text'
            cat SHA256SUMS
            echo '```'
            echo 'The publish-package artifact includes the original gem, checksum, and file inventory.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-package
          path: |
            package/volcano-sdk-*.gem
            package/SHA256SUMS
            package/package-files.txt
          if-no-files-found: error

  publish:
    if: >-
      !cancelled() &&
      ((github.event_name == 'release' && needs.build.result == 'success' && needs.attest.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish &&
        github.ref == 'refs/heads/main' && needs.prepare.result == 'success'))
    needs: [build, prepare, attest]
    outputs:
      version: ${{ steps.push.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version || needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ github.event_name == 'release' && 'release-package' || 'publish-package' }}
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: false
      - run: sha256sum --check SHA256SUMS
      - uses: rubygems/configure-rubygems-credentials@2a7221c7c44c30ebc68eda38fa25c60b918245c7
        with:
          trusted-publisher: true
      - name: Push the validated gem
        id: push
        run: |
          gem push "volcano-sdk-$RELEASE_VERSION.gem" --host https://rubygems.org
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  release-link:
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acceptance-tests
          path: acceptance-output
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
      - name: Check the registry download in a fresh consumer
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          mkdir consumer
          tar -xzf acceptance-output/sdk-acceptance.tar.gz -C consumer
          cd consumer
          gem fetch volcano-sdk --version "$RELEASE_VERSION" --platform ruby --clear-sources --source https://rubygems.org
          ruby -rjson -rdigest -e 'a=JSON.parse(File.read("acceptance.json")); abort "Registry package differs from build" unless Digest::SHA256.file(a.fetch("filename")).hexdigest == a.fetch("sha256")'
          bash .github/scripts/smoke-gem.sh ./*.gem
      - name: Link the published RubyGems version in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          notes="$(gh release view "$tag" --json body --jq '.body')"
          link="[View $tag on RubyGems](https://rubygems.org/gems/volcano-sdk/versions/$RELEASE_VERSION)"
          if [[ "$notes" != *"$link"* ]]; then
            printf '%s\n\n%s\n' "$notes" "$link" | gh release edit "$tag" --notes-file -
          fi
