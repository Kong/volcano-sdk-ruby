name: Publish SDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and ancestry
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          bash .github/scripts/validate-release.sh
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  build:
    needs: [validate, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: gem build volcano-sdk.gemspec
      - name: Smoke test the gem
        run: |
          gem unpack volcano-sdk-*.gem --target unpacked
          bundle exec ruby -Iunpacked/volcano-sdk-$(ruby -Ilib -rvolcano/version -e 'puts Volcano::VERSION')/lib -rvolcano -e 'abort unless Volcano::Client'
      - name: Check package version against the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: test "v$(ruby -Ilib -rvolcano/version -e 'puts Volcano::VERSION')" = "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: volcano-sdk-*.gem
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      # Publishing receives only the checked build artifact, not source or build credentials.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: package
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: gem push package/*.gem
