plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2
  Exclude:
    - "lib/volcano/generated/**/*"
    - "vendor/**/*"

Metrics/BlockLength:
  Exclude:
    - "features/step_definitions/**/*"
    - "spec/**/*"

Metrics/AbcSize:
  Max: 12

Metrics/BlockNesting:
  Max: 2

Metrics/CyclomaticComplexity:
  Max: 6

Metrics/MethodLength:
  Max: 10
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call

Metrics/ParameterLists:
  Max: 5
  CountKeywordArgs: true
  MaxOptionalParameters: 2

Metrics/PerceivedComplexity:
  Max: 6

RSpec/ExampleLength:
  Max: 12
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call

RSpec/MultipleExpectations:
  Max: 4

RSpec/NestedGroups:
  Max: 2

# Script/contract specs have no single class; two private implementation
# constants are resolved dynamically and cannot be recognized by this cop.
RSpec/DescribeClass:
  Exclude:
    - "spec/contract_structure_spec.rb"
    - "spec/volcano/errors_spec.rb"
    - "spec/volcano/generated_transport_spec.rb"
    - "spec/volcano/generation_spec.rb"
    - "spec/volcano/realtime/protocol_spec.rb"

# These files define stateful transport/socket fakes inside their example groups;
# their instance variables belong to the fakes, not to RSpec example state.
RSpec/InstanceVariable:
  Exclude:
    - "spec/volcano/errors_spec.rb"
    - "spec/volcano/facade_spec.rb"
    - "spec/volcano/generated_transport_spec.rb"
    - "spec/volcano/realtime/protocol_spec.rb"
    - "spec/volcano/realtime_spec.rb"

# These same fake classes intentionally keep their helper constants scoped to
# the example group; the files are isolated processes under RSpec.
RSpec/LeakyConstantDeclaration:
  Exclude:
    - "spec/volcano/errors_spec.rb"
    - "spec/volcano/facade_spec.rb"
    - "spec/volcano/generated_transport_spec.rb"
    - "spec/volcano/generation_spec.rb"
    - "spec/volcano/realtime/protocol_spec.rb"
    - "spec/volcano/realtime_spec.rb"

# Cross-cutting contract/facade specs intentionally cover more than one class.
RSpec/SpecFilePathFormat:
  Exclude:
    - "spec/volcano/contract_world_spec.rb"
    - "spec/volcano/facade_spec.rb"

Lint/ConstantDefinitionInBlock:
  Exclude:
    - "spec/volcano/errors_spec.rb"
    - "spec/volcano/facade_spec.rb"
    - "spec/volcano/generated_transport_spec.rb"
    - "spec/volcano/generation_spec.rb"
    - "spec/volcano/realtime/protocol_spec.rb"
    - "spec/volcano/realtime_spec.rb"

Style/Documentation:
  Enabled: true
  Exclude:
    - "features/**/*"
    - "spec/**/*"
