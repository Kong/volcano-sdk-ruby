AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - "lib/volcano/generated/**/*"

Metrics/BlockLength:
  Exclude:
    - "features/step_definitions/**/*"
    - "spec/**/*"

Lint/ConstantDefinitionInBlock:
  Exclude:
    - "spec/**/*"

Metrics/AbcSize:
  Max: 30

Metrics/ClassLength:
  Max: 160

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/MethodLength:
  Max: 20

Metrics/ParameterLists:
  Max: 6

Metrics/PerceivedComplexity:
  Max: 10

Style/Documentation:
  Enabled: false
