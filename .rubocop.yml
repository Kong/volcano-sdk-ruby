require:
  - "./maintainers/rubocop/coverage_suppression.rb"

plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  inherit_mode:
    merge:
      - Include
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2
  Include:
    - ".simplecov"
    - ".github/scripts/**/*.rb"
  Exclude:
    - "lib/volcano/generated/**/*"
    - "vendor/**/*"

Metrics/BlockLength:
  Exclude:
    - "features/step_definitions/**/*"
    - "spec/**/*"

Metrics/MethodLength:
  Max: 10
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call

Metrics/CyclomaticComplexity:
  Max: 5

RSpec/ExampleLength:
  Max: 15
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call

RSpec/MultipleExpectations:
  Max: 5

Style/Documentation:
  Enabled: true
  Exclude:
    - "features/**/*"
    - "spec/**/*"

Volcano/CoverageSuppression:
  Enabled: true
